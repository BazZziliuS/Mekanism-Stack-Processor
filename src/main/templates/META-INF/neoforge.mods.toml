modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BazZziliuS/Mekanism-Stack-Processor/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/BazZziliuS/Mekanism-Stack-Processor"
authors="BazZziliuS"
credits="Thanks to the teams behind Mekanism, Mekanism: MoreMachine and Evolved Mekanism"
description='''
Adds batch processing to Mekanism machines: each operation handles multiple items, up to a full stack, depending on the machine tier.

Default items per operation:
- Basic Factory: 8
- Advanced Factory: 16
- Elite Factory: 32
- Ultimate Factory: 64
- Regular machines: 4

Chemical factories use their own multipliers. All values can be changed in config/mekanismstackprocessor-common.toml.

Optional integrations:
- Mekanism: MoreMachine - item and chemical factories
- Evolved Mekanism - Alloying Factory, machines and extended factory tiers
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}.moremachine.mixins.json"
requiredMods=["mekmm"]

[[mixins]]
config="${mod_id}.evolvedmekanism.mixins.json"
requiredMods=["evolvedmekanism"]

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
type="required"
reason="This mod modifies Mekanism machines"
versionRange="[10.7.19,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekmm"
type="optional"
reason="Optional integration for MoreMachine factories batch processing"
versionRange="[1.4.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="evolvedmekanism"
type="optional"
reason="Optional integration for Evolved Mekanism machines batch processing"
versionRange="[1.3.0,)"
ordering="AFTER"
side="BOTH"
